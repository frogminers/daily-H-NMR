<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSME Fixed Demo</title>
    
    <script type="text/javascript" src="https://jsme.cloud.chemdoodle.com/jsme/jsme.nocache.js"></script>

    <style>
        body {
            background-color: #121212;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }

        #editor-container {
            width: 100%;
            max-width: 500px;
            height: 400px;
            background-color: #ffffff;
            border: 4px solid #333;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div id="editor-container"></div>

    <script>
        // This function runs automatically, but now it acts as a smart checker
        function jsmeOnLoad() {
            // We check if the 'JSME' object actually exists yet (like checking if a key is in a dict)
            if (typeof JSME !== 'undefined') {
                
                // If it exists, render the builder immediately!
                new JSME.JSME("editor-container", "100%", "100%");
                console.log("Success! JSME object detected and rendered.");
                
            } else {
                // If it's not ready yet, wait 100 milliseconds and check again
                console.log("JSME engine is booting up... retrying shortly.");
                setTimeout(jsmeOnLoad, 100);
            }
        }
    </script>

</body>
</html>
