<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSME Local Demo</title>
    
    <script type="text/javascript">
        // This tells JSME exactly where its subfolders are BEFORE the script even runs
        document.jsmeAppletCodebase = "jsme/";
    </script>

    <script type="text/javascript" src="jsme/jsme.nocache.js"></script>

    <style>
        body {
            background-color: #121212;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }

        #editor-container {
            width: 100%;
            max-width: 500px;
            height: 400px;
            background-color: #ffffff;
            border: 4px solid #333;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div id="editor-container"></div>

    <script>
        // This function will now fire smoothly because the folder path was already set above
        function jsmeOnLoad() {
            if (typeof JSME !== 'undefined') {
                new JSME.JSME("editor-container", "100%", "100%");
            } else {
                // If the background scripts take a moment, retry safely
                setTimeout(jsmeOnLoad, 50);
            }
        }
    </script>

</body>
</html>
