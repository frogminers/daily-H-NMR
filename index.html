<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily H-NMR Pure Demo</title>
    
    <script type="text/javascript" src="https://jsme.cloud.chemdoodle.com/jsme/jsme.nocache.js"></script>

    <style>
        body {
            background-color: #121212;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }

        #editor-container {
            width: 100%;
            max-width: 500px;
            height: 400px;
            background-color: #ffffff;
            border: 4px solid #333;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div id="editor-container"></div>

    <script>
        // Because we are using the cloud version, we do not need the document.jsmeAppletCodebase line anymore!
        function jsmeOnLoad() {
            new JSME.JSME("editor-container", "100%", "100%");
        }
    </script>

</body>
</html>
